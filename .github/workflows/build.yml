name: MacOS
run-name: "MacOS · source run #${{ inputs.source_run_id }}.${{ inputs.source_run_attempt }} · ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA.
        required: true
        type: string
      source_ref:
        description: Source Git ref.
        required: true
        type: string
      source_run_id:
        description: Source Release workflow run ID.
        required: true
        type: string
      source_run_attempt:
        description: Source Release workflow run attempt.
        required: true
        type: string
      version:
        description: Display version from the source commit.
        required: true
        type: string
      appupdateversion:
        description: Update version from the source commit.
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: MacOS ${{ matrix.arch }}
    runs-on: macos-26
    timeout-minutes: 359
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x86_64
            updater: tmacupd
          - arch: arm64
            cmake_arch: arm64
            updater: tarmacupd

    env:
      REPO_NAME: 'AyuGramDesktop-Plus'
      PREPARE_PATH: 'Telegram/build/prepare/prepare.py'
      MAC_LIBRARIES_CACHE_VERSION: 'v4'
      CCACHE_MAXSIZE: 4G
      CCACHE_DIR: ${{ github.workspace }}/.ayugram-ccache
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'

    steps:
      - name: Check out repository.
        uses: actions/checkout@v7
        with:
          repository: Kindness-Kismet/AyuGramDesktop-Plus
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          fetch-depth: 1
          path: ${{ env.REPO_NAME }}
          persist-credentials: false

      - name: Validate source request.
        working-directory: ${{ env.REPO_NAME }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          VERSION: ${{ inputs.version }}
          APP_UPDATE_VERSION: ${{ inputs.appupdateversion }}
        run: |
          set -euo pipefail
          python3 scripts/build_provenance.py validate-source \
            --repository Kindness-Kismet/AyuGramDesktop-Plus \
            --sha "$SOURCE_SHA" \
            --ref "$SOURCE_REF" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --version "$VERSION" \
            --appupdateversion "$APP_UPDATE_VERSION" \
            --workflow-path .github/workflows/build-release.yml

      - name: Check packer cache guard.
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; assert b'ccache:disable' in Path('$REPO_NAME/Telegram/SourceFiles/_other/packer.cpp').read_bytes()[:4096]"

      - name: First set up.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          formulae=()
          if ! command -v automake >/dev/null || ! command -v autoreconf >/dev/null; then
            formulae+=(automake)
          fi
          command -v glibtoolize >/dev/null || formulae+=(libtool)
          command -v meson >/dev/null || formulae+=(meson)
          command -v nasm >/dev/null || formulae+=(nasm)
          command -v ninja >/dev/null || formulae+=(ninja)
          command -v pkg-config >/dev/null || formulae+=(pkg-config)
          if ((${#formulae[@]})); then
            brew install "${formulae[@]}"
          fi
          command -v ccache >/dev/null || brew install ccache

          # Spotlight indexing only slows the dependency build down.
          sudo mdutil -a -i off

          xcodeKey=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)
          echo "XCODE_CACHE_KEY=$xcodeKey" >> "$GITHUB_ENV"
          mkdir -p "$CCACHE_DIR" "$RUNNER_TEMP/ccache-bin"
          # Xcode 构建环境的 PATH 不含 Homebrew 前缀，wrapper 必须用绝对路径。
          ccache_bin=$(command -v ccache)
          for compiler in clang clang++ cc c++ gcc g++; do
            printf '%s\n' '#!/bin/sh' \
              "exec $ccache_bin /usr/bin/$compiler \"\$@\"" \
              > "$RUNNER_TEMP/ccache-bin/$compiler"
            chmod +x "$RUNNER_TEMP/ccache-bin/$compiler"
          done

      - name: Check out cache maintenance scripts.
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .builder-ci
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Restore libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
          key: ${{ runner.OS }}-libs-${{ env.MAC_LIBRARIES_CACHE_VERSION }}-${{ matrix.arch }}-${{ env.XCODE_CACHE_KEY }}-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH), format('{0}/Telegram/build/qt_version.py', env.REPO_NAME), format('{0}/Telegram/build/prepare/patches/libjxl-macos-universal.patch', env.REPO_NAME), format('{0}/scripts/trim_macos_libraries.sh', env.REPO_NAME)) }}
          restore-keys: |
            ${{ runner.OS }}-libs-${{ env.MAC_LIBRARIES_CACHE_VERSION }}-${{ matrix.arch }}-${{ env.XCODE_CACHE_KEY }}-
            ${{ runner.OS }}-libs-v3-universal-${{ env.XCODE_CACHE_KEY }}-

      - name: Restore ccache.
        id: cache-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-ccache-v1-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.OS }}-ccache-v1-${{ matrix.arch }}-

      - name: Build dependencies.
        id: build-dependencies
        run: |
          set -euo pipefail
          # 正式版不传 skip-release，依赖按 Release 配置编译
          export PATH="$RUNNER_TEMP/ccache-bin:$PATH"
          export CCACHE_SLOPPINESS=pch_defines,time_macros
          ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      - name: Free up disk space.
        id: trim-dependencies
        run: |
          set -euo pipefail
          ./$REPO_NAME/scripts/trim_macos_libraries.sh Libraries

      # 裁剪完成后先清理本架构旧缓存，再保存依赖。
      - name: Prepare libraries cache update.
        id: prepare-libs
        if: steps.build-dependencies.outcome == 'success' && steps.trim-dependencies.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: ${{ runner.OS }}-libs-${{ env.MAC_LIBRARIES_CACHE_VERSION }}-${{ matrix.arch }}-
          CURRENT_KEY: ${{ steps.cache-libs.outputs.cache-primary-key }}
        run: |
          python3 .builder-ci/.github/scripts/prepare_cache_save.py \
            --prefix "$CACHE_PREFIX" --key "$CURRENT_KEY" \
            Libraries

      - name: Save libraries cache.
        if: steps.prepare-libs.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: Libraries
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      # Packer 是 Telegram 的构建依赖，私钥头文件必须在编译前就位
      - name: Write packer signing key.
        env:
          PACKER_PRIVATE_H: ${{ secrets.PACKER_PRIVATE_H }}
        run: |
          set -euo pipefail
          test -n "$PACKER_PRIVATE_H"
          printf '%s' "$PACKER_PRIVATE_H" > $REPO_NAME/Telegram/SourceFiles/_other/packer_private.h

      - name: Build AyuGram Desktop.
        run: |
          set -euo pipefail
          cd $REPO_NAME/Telegram

          # Xcode generator 会忽略 CMAKE_*_COMPILER_LAUNCHER，必须经 Xcode attribute 注入 wrapper。
          # 多架构时 AUTOMOC 跳过 moc_predefs；单架构会生成，其 -dM -E 命令不含平台标志，
          # clang 回退读取 xcodebuild 脚本阶段导出的多个 *_DEPLOYMENT_TARGET 环境变量并报冲突。
          # 该命令是 CMake 生成物无法注入标志，直接关闭 predefs 生成。
          export CCACHE_SLOPPINESS=pch_defines,time_macros
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -D CMAKE_AUTOMOC_COMPILER_PREDEFINES=OFF \
            -D "CMAKE_XCODE_ATTRIBUTE_CC=$RUNNER_TEMP/ccache-bin/clang" \
            -D "CMAKE_XCODE_ATTRIBUTE_CXX=$RUNNER_TEMP/ccache-bin/clang++" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
            -D AYUGRAM_BUILD_PACKER=ON

          cmake --build ../out --config Release --parallel

      - name: Check architecture release output.
        run: |
          set -euo pipefail
          cd "$REPO_NAME/out/Release"
          test -d AyuGram.app
          test -x Packer

          test "$(lipo -archs AyuGram.app/Contents/MacOS/AyuGram)" = "${{ matrix.cmake_arch }}"
          test "$(lipo -archs Packer)" = "${{ matrix.cmake_arch }}"
          test ! -f Updater || test "$(lipo -archs Updater)" = "${{ matrix.cmake_arch }}"

      # 更新格式拒收解压后超过 1 GiB 的内容，打包前移除调试符号。
      - name: Strip debug symbols.
        run: |
          set -euo pipefail
          cd $REPO_NAME/out/Release
          bin=AyuGram.app/Contents/MacOS/AyuGram
          before=$(stat -f %z "$bin")
          strip -x -S "$bin"
          after=$(stat -f %z "$bin")
          echo "binary: $before -> $after bytes"
          size=$(du -sk AyuGram.app | cut -f1)
          echo "bundle: $((size * 1024)) bytes"
          if test "$((size * 1024))" -ge 1073741824; then
            echo "bundle still above the 1 GiB limit of the update format"
            exit 1
          fi

      - name: Show ccache stats.
        if: always()
        run: ccache --show-stats || true

      - name: Enforce compiler cache budget.
        run: ccache --cleanup

      - name: Prepare compiler cache update.
        id: prepare-ccache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: ${{ runner.OS }}-ccache-v1-${{ matrix.arch }}-
          CURRENT_KEY: ${{ steps.cache-ccache.outputs.cache-primary-key }}
        run: |
          python3 .builder-ci/.github/scripts/prepare_cache_save.py \
            --prefix "$CACHE_PREFIX" --key "$CURRENT_KEY" \
            "$CCACHE_DIR"

      - name: Save ccache.
        if: steps.prepare-ccache.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      - name: Package release output.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^AppVersionStrSmall //p' $REPO_NAME/Telegram/build/version)
          test -n "$version"
          cd $REPO_NAME/out/Release
          zip -r "AyuGram-v${version}-macos-${{ matrix.arch }}.zip" AyuGram.app
          test ! -f Updater || zip "AyuGram-v${version}-macos-${{ matrix.arch }}.zip" Updater

      # 每个架构只生成自己的更新包，避免把两个架构塞进同一份 Universal 包。
      - name: Pack update.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^AppUpdateVersion  *//p' $REPO_NAME/Telegram/build/version)
          test -n "$version"
          cd $REPO_NAME/out/Release
          ./Packer -version "$version" -arch ${{ matrix.cmake_arch }} -path AyuGram.app
          test -s "${{ matrix.updater }}${version}"

      - name: Write artifact provenance.
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          VERSION: ${{ inputs.version }}
          APP_UPDATE_VERSION: ${{ inputs.appupdateversion }}
        run: |
          set -euo pipefail
          release="$REPO_NAME/out/Release"
          archive="$release/AyuGram-v${VERSION}-macos-${{ matrix.arch }}.zip"
          update="$release/${{ matrix.updater }}${APP_UPDATE_VERSION}"
          python3 "$REPO_NAME/scripts/build_provenance.py" write-artifact-manifest \
            --platform macos \
            --arch "${{ matrix.arch }}" \
            --source-repository Kindness-Kismet/AyuGramDesktop-Plus \
            --source-ref "$SOURCE_REF" \
            --source-sha "$SOURCE_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --builder-repository "$GITHUB_REPOSITORY" \
            --builder-run-id "$GITHUB_RUN_ID" \
            --builder-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "$VERSION" \
            --appupdateversion "$APP_UPDATE_VERSION" \
            --output "$release/provenance-macos-${{ matrix.arch }}.json" \
            --file "$archive" \
            --file "$update"

      - name: Upload architecture artifact.
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-macOS-${{ matrix.arch }}
          path: |
            ${{ env.REPO_NAME }}/out/Release/AyuGram-v*-macos-${{ matrix.arch }}.zip
            ${{ env.REPO_NAME }}/out/Release/${{ matrix.updater }}*
            ${{ env.REPO_NAME }}/out/Release/provenance-macos-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove packer signing key.
        if: always()
        run: rm -f "$REPO_NAME/Telegram/SourceFiles/_other/packer_private.h"
