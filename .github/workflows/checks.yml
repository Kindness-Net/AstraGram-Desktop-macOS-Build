name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository.
        uses: actions/checkout@v7

      - name: Test cache update guards.
        run: python3 -m unittest discover -s .github/tests -v

      - name: Run actionlint.
        env:
          ACTIONLINT_VERSION: 1.7.12
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint \
            --pattern "$archive" --pattern "actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            --dir "$RUNNER_TEMP"
          grep "  ${archive}$" "$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            | (cd "$RUNNER_TEMP" && sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
